workflows:
  android-apk-build:
    name: Build Android APK (Capacitor / Background SMS Wallet)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22.12.0
      java: 21
    scripts:
      - name: Extract app-source.zip if present
        script: |
          if [ -f "app-source.zip" ]; then
            echo "Found app-source.zip, extracting..."
            python3 -m zipfile -e app-source.zip .
            echo "Extraction done. Listing top-level:"
            ls -la
            echo "Searching for package.json..."
            if [ -f package.json ]; then
              export APP_DIR="."
            else
              APP_DIR=$(find . -maxdepth 5 -name package.json -exec dirname {} \; | head -n 1 || true)
              if [ -z "$APP_DIR" ]; then
                echo "package.json not found after extraction" >&2
                export APP_DIR="."
              else
                export APP_DIR="$APP_DIR"
              fi
            fi
            echo "APP_DIR=$APP_DIR"
          else
            echo "No app-source.zip found; assuming repository files are present in repo root."
            if [ -f package.json ]; then export APP_DIR="."; else export APP_DIR="."; fi
          fi

      - name: Install Dependencies
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Installing dependencies in $(pwd)"
          pwd
          ls -la
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found; aborting install" >&2
            exit 1
          fi

      - name: Build Web Production Assets
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Building web assets in $(pwd)"
          npm run build

      - name: Setup Capacitor & Android Native Project
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Setting up Capacitor in $(pwd)"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            echo "android folder missing; running npx cap add android"
            npx cap add android || true
          fi
          npx cap sync android || true

      - name: Ensure Android Java/Kotlin compatibility (dynamic fixes)
        script: |
          set -e
          # This script detects the Java runtime and patches any android/build.gradle files to set
          # compileOptions and kotlinOptions to a compatible target (21 if available, otherwise 17).
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then ROOT_DIR="$APP_DIR"; else ROOT_DIR="."; fi
          echo "Applying Android compatibility fixes under: $ROOT_DIR"
          python3 - <<'PY'
            import os
            import re
            import subprocess

            root_dir = os.environ.get('ROOT_DIR', '.')

            # detect java major version
            java_version = None
            try:
                p = subprocess.run(['java', '-version'], stderr=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
                s = p.stderr + p.stdout
                m = re.search(r'version \"?([0-9]+)', s)
                if m:
                    java_version = int(m.group(1))
            except Exception as e:
                print('Warning: could not determine java version:', e)

            # choose target version
            if java_version and java_version >= 21:
                target = 21
            else:
                target = 17

            java_const = f'VERSION_{target}'
            print(f'Detected java_version={java_version}, using target={target}')

            # walk and patch gradle files
            for dirpath, dirnames, filenames in os.walk(root_dir):
                for fname in filenames:
                    if fname == 'build.gradle' or fname.endswith('.gradle.kts') or fname == 'build.gradle.kts':
                        path = os.path.join(dirpath, fname)
                        try:
                            txt = open(path, 'r', encoding='utf-8').read()
                        except Exception:
                            print('Skipping non-text file', path)
                            continue
                        modified = txt
                        if 'android {' in txt:
                            # replace existing JavaVersion.VERSION_X or numeric versions
                            modified = re.sub(r'sourceCompatibility\s+JavaVersion\.VERSION_\d+', 'sourceCompatibility JavaVersion.' + java_const, modified)
                            modified = re.sub(r'targetCompatibility\s+JavaVersion\.VERSION_\d+', 'targetCompatibility JavaVersion.' + java_const, modified)
                            modified = re.sub(r'sourceCompatibility\s*=\s*\"?\d+\"?', 'sourceCompatibility JavaVersion.' + java_const, modified)
                            modified = re.sub(r'targetCompatibility\s*=\s*\"?\d+\"?', 'targetCompatibility JavaVersion.' + java_const, modified)
                            # kotlin jvmTarget
                            modified = re.sub(r'jvmTarget\s*=\s*\"?\d+\"?', 'jvmTarget = "' + str(target) + '"', modified)
                            # if neither compileOptions nor kotlinOptions exist, insert them after android {
                            if 'compileOptions' not in modified and 'kotlinOptions' not in modified:
                                insert_block = (
                                    'android {\n'
                                    '    compileOptions {\n'
                                    '        sourceCompatibility JavaVersion.' + java_const + '\n'
                                    '        targetCompatibility JavaVersion.' + java_const + '\n'
                                    '    }\n'
                                    '    kotlinOptions {\n'
                                    '        jvmTarget = "' + str(target) + '"\n'
                                    '    }\n'
                                    )
                                modified = modified.replace('android {', insert_block, 1)
                        if modified != txt:
                            try:
                                open(path, 'w', encoding='utf-8').write(modified)
                                print('Patched', path)
                            except Exception as e:
                                print('Failed to write patch to', path, e)
          PY
          echo "Android compatibility fixes complete. Listing modified gradle files (if any):"
          find "$ROOT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -maxdepth 6 -print

      - name: Build Debug APK File
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then
            cd "$APP_DIR/android" || cd android
          else
            cd android
          fi
          echo "Building APK from $(pwd)"
          pwd
          ls -la
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - dist/**/*
