workflows:
  android-apk-build:
    name: Build Android APK (Capacitor / Background SMS Wallet)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22.12.0
      java: 21
    scripts:
      - name: Extract app-source.zip if present
        script: |
          if [ -f "app-source.zip" ]; then
            echo "Found app-source.zip, extracting..."
            python3 -m zipfile -e app-source.zip .
            echo "Extraction done. Listing top-level:"
            ls -la
            echo "Searching for package.json..."
            if [ -f package.json ]; then
              export APP_DIR="."
            else
              APP_DIR=$(find . -maxdepth 5 -name package.json -exec dirname {} \; | head -n 1 || true)
              if [ -z "$APP_DIR" ]; then
                echo "package.json not found after extraction" >&2
                export APP_DIR="."
              else
                export APP_DIR="$APP_DIR"
              fi
            fi
            echo "APP_DIR=$APP_DIR"
          else
            echo "No app-source.zip found; assuming repository files are present in repo root."
            if [ -f package.json ]; then export APP_DIR="."; else export APP_DIR="."; fi
          fi

      - name: Install Dependencies
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Installing dependencies in $(pwd)"
          pwd
          ls -la
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found; aborting install" >&2
            exit 1
          fi

      - name: Build Web Production Assets
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Building web assets in $(pwd)"
          npm run build

      - name: Setup Capacitor & Android Native Project
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then cd "$APP_DIR"; fi
          echo "Setting up Capacitor in $(pwd)"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            echo "android folder missing; running npx cap add android"
            npx cap add android || true
          fi
          npx cap sync android || true

      - name: Install Gradle init script to force Java/Kotlin compatibility
        script: |
          # create ~/.gradle/init.gradle to force compileOptions and kotlin jvmTarget across projects
          mkdir -p ~/.gradle
          echo "Installing init.gradle to ~/.gradle/init.gradle"
          JAVA_VER=$(java -version 2>&1 | awk -F\" '/version/ {print $2}' | awk -F. '{print $1}') || true
          if [ -z "$JAVA_VER" ]; then JAVA_VER=17; fi
          if [ "$JAVA_VER" -ge 21 ]; then TARGET=21; else TARGET=17; fi
          cat > ~/.gradle/init.gradle <<'INIT'
allprojects {
    gradle.projectsEvaluated {
        rootProject.allprojects.each { project ->
            if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
                try {
                    def androidExt = project.extensions.findByName('android')
                    if (androidExt != null) {
                        androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                        androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                    }
                } catch (ignored) {}
                // configure Kotlin compile tasks
                project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions.jvmTarget = "17"
                }
            }
        }
    }
}
INIT
          echo "Installed ~/.gradle/init.gradle (TARGET=$TARGET)"

      - name: Ensure Android Java/Kotlin compatibility (dynamic fixes)
        script: |
          set -e
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then ROOT_DIR="$APP_DIR"; else ROOT_DIR="."; fi
          echo "Applying Android compatibility fixes under: $ROOT_DIR"
          find "$ROOT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' \) -maxdepth 6 -print0 | \
          while IFS= read -r -d '' file; do
            echo "Processing $file"
            cp "$file" "$file.bak" || true
            perl -0777 -pe "
              \$target = 17;
              s/sourceCompatibility\\s+JavaVersion\\.VERSION_\\d+/sourceCompatibility JavaVersion.VERSION_\$target/sg;
              s/targetCompatibility\\s+JavaVersion\\.VERSION_\\d+/targetCompatibility JavaVersion.VERSION_\$target/sg;
              s/sourceCompatibility\\s*=\\s*\\'?\\\"?\\d+\\\"?\\'?/sourceCompatibility JavaVersion.VERSION_\$target/sg;
              s/targetCompatibility\\s*=\\s*\\'?\\\"?\\d+\\\"?\\'?/targetCompatibility JavaVersion.VERSION_\$target/sg;
              s/jvmTarget\\s*=\\s*\\\"?\\d+\\\"?/jvmTarget = \"\$target\"/sg;
              if (index(\$_, "android {") != -1 && index(\$_, "compileOptions") == -1 && index(\$_, "kotlinOptions") == -1) {
                \$_ =~ s/android \{/android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_\$target\n        targetCompatibility JavaVersion.VERSION_\$target\n    }\n    kotlinOptions {\n        jvmTarget = \"\$target\"\n    }\n/;
              }
            " "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            if ! cmp -s "$file" "$file.bak"; then
              echo "Patched $file"
            else
              echo "No changes needed for $file"
              rm -f "$file.bak"
            fi
          done
          echo "Android compatibility fixes complete."
          find "$ROOT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -maxdepth 6 -print

      - name: Build Debug APK File
        script: |
          if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "." ]; then
            cd "$APP_DIR/android" || cd android
          else
            cd android
          fi
          echo "Building APK from $(pwd)"
          pwd
          ls -la
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - dist/**/*
