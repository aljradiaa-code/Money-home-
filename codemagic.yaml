workflows:
  android-apk-build:
    name: Build Android APK (Capacitor / Background SMS Wallet)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20.11.0
      java: 17
    scripts:
      - name: Extract app-source.zip if present
        script: |
          if [ -f "app-source.zip" ]; then
            echo "Found app-source.zip, extracting contents cleanly with Python..."
            python3 -m zipfile -e app-source.zip .
          fi
      - name: Install Dependencies
        script: |
          npm ci || npm install
      - name: Build Web Production Assets
        script: |
          npm run build
      - name: Setup Capacitor & Android Native Project
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap init "StoreWallet" "com.storewallet.app" --web-dir dist
            npx cap add android
          fi
          npx cap sync android
      - name: Build Debug APK File
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - dist/**/*
